[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spirrow-prismind"
version = "0.1.0"
description = "MCP server that integrates knowledge from multiple sources and provides context-aware information"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "SpirrowGames" }
]
keywords = ["mcp", "knowledge-management", "context", "ai"]

dependencies = [
    # Upper bound is load-bearing, not caution. mcp 2.0 removed
    # `Server.list_tools` and renamed `Tool.inputSchema` -> `input_schema`,
    # so `PrismindServer` cannot even be constructed under 2.x
    # (server.py:1366 raises AttributeError during handler registration).
    # Lifting this bound means migrating the server to the 2.x API -- a
    # deliberate piece of work, not a resolver side effect.
    #
    # These specifiers are a compatibility floor, not a description of
    # what production runs. Read the version from uv.lock (what a release
    # installs, see deploy/README.md) or from the running venv -- never
    # from a bound here.
    #
    # Measured 2026-09-16, before the deploy learned to install from the
    # lock, three answers were live at once: both release venvs had mcp
    # 1.25.0 from 2026-01-20, uv.lock resolved 1.26.0, and CI -- which
    # installs unpinned -- was on 1.30.0. Nothing had gone wrong; nothing
    # had ever installed the lock. Lower bounds are satisfied by whatever
    # is already there, so an unchanged venv always looked correct.
    #
    # CI still resolves fresh on every run and so still floats ahead of
    # the lock. That is deliberate: it is how a release that would break
    # under newer dependencies is found before the lock is refreshed.
    "mcp>=1.0.0,<2",
    "google-api-python-client>=2.100.0",
    "google-auth-httplib2>=0.1.0",
    "google-auth-oauthlib>=1.0.0",
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
    # Frontmatter on filesystem-backed documents (FilesystemDocumentStore).
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    # Declared explicitly because `--transport sse` imports them directly
    # (spirrow_prismind.transport). They already arrive transitively via
    # mcp, but an undeclared import breaks the moment mcp drops them, and
    # CI resolves dependencies fresh on every run rather than from uv.lock.
    "starlette>=0.40.0",
    "uvicorn>=0.30.0",
    "tomli>=2.0.0",
    "tomli-w>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
]

[project.scripts]
spirrow-prismind = "spirrow_prismind.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/spirrow_prismind"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
